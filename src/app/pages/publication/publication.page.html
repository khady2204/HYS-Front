<ion-header class="ion-no-border publication-header">
  <ion-toolbar class="publication-toolbar">
    <ion-buttons slot="start" class="header-start-buttons">
      <!-- Bouton retour SANS ion-back-button, avec ion-button normal -->
      <ion-button
        (click)="goBack()"
        fill="clear"
        class="custom-back-button">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="publication-title">
      Créer une publication
    </ion-title>

    <ion-buttons slot="end" class="header-end-buttons">
      <ion-button
        [disabled]="!canPublish"
        (click)="publier()"
        [class.publishing]="isPublishing"
        class="publish-button"
        fill="clear"
        strong>
        <span *ngIf="!isPublishing">PUBLIER</span>
        <ion-spinner *ngIf="isPublishing" name="crescent" class="publish-spinner"></ion-spinner>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" class="publication-content">
  <div class="content-wrapper">

    <!-- TEXTAREA SIMPLIFIÉ -->
    <div class="textarea-wrapper">
      <textarea
        [(ngModel)]="texte"
        placeholder="Partagez votre avis..."
        [maxlength]="MAX_TEXT_LENGTH"
        class="native-textarea"
        rows="8"></textarea>
    </div>

    <!-- Compteur de caractères -->
    <div class="char-counter"
         [class.warning]="remainingChars < 100"
         [class.danger]="remainingChars < 0">
      {{ remainingChars }}
    </div>

    <!-- Prévisualisation des médias -->
    <div *ngIf="medias.length > 0" class="media-section">
      <div class="media-grid" [ngClass]="{'single': medias.length === 1}">
        <div *ngFor="let media of medias" class="media-item">

          <img *ngIf="media.type === 'image'"
               [src]="media.url"
               class="media-preview"
               (click)="previewMedia(media)"
               alt="Preview">

          <video *ngIf="media.type === 'video'"
                 [src]="media.url"
                 class="media-preview"
                 controls>
          </video>

          <ion-button
            fill="clear"
            class="remove-btn"
            (click)="removeMedia(media.id)">
            <ion-icon name="close-circle" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border publication-footer">
  <ion-toolbar class="footer-toolbar">
    <ion-buttons slot="start" class="media-actions">
      <ion-button
        fill="clear"
        (click)="takePhoto()"
        [disabled]="medias.length >= MAX_MEDIA_COUNT"
        class="media-action-button">
        <ion-icon slot="icon-only" name="camera-outline"></ion-icon>
      </ion-button>

      <ion-button
        fill="clear"
        (click)="recordVideo()"
        [disabled]="medias.length >= MAX_MEDIA_COUNT"
        class="media-action-button">
        <ion-icon slot="icon-only" name="videocam-outline"></ion-icon>
      </ion-button>

      <ion-button
        fill="clear"
        (click)="openGallery()"
        [disabled]="medias.length >= MAX_MEDIA_COUNT"
        class="media-action-button">
        <ion-icon slot="icon-only" name="images-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>

<input
  type="file"
  id="fileInput"
  accept="image/*,video/*"
  (change)="handleFileInput($event)"
  class="hidden-file-input"
  multiple
/>
